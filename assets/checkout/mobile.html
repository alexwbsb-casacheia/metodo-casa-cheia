<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;background:#14110d;cursor:none}
body{width:1080px;transform-origin:0 0;font-family:Inter,sans-serif;color:#f5efe6}
.b{width:1080px;border:6px solid #c9a24a;background:#14110d;padding:44px 54px;display:flex;flex-direction:column;justify-content:space-between}
.tag{align-self:flex-start;background:#d9544d;color:#fff;font-weight:800;font-size:40px;letter-spacing:.06em;padding:14px 26px;border-radius:12px}
h1{font-family:'Playfair Display',serif;font-size:118px;line-height:.98;color:#e8c877;margin-top:18px}
.sub{font-size:48px;line-height:1.2;font-weight:700;margin-top:18px}
.sub b{color:#e8c877}
.bot{display:flex;gap:40px;align-items:center;margin-top:24px}
.cover{width:196px;height:294px;flex:none;border:3px solid #c9a24a}
.cover img{width:100%;height:100%;display:block}
.r{flex:1;display:flex;flex-direction:column;gap:16px}
.price{background:#16a34a;border-radius:20px;padding:20px 26px;text-align:center}
.price small{display:block;font-size:34px;font-weight:800;letter-spacing:.06em}
.price strong{display:block;font-size:92px;font-weight:800;line-height:1}
.chip{background:#211e1b;border:2px solid #9a7a2e;border-radius:14px;padding:12px 20px;font-size:38px;font-weight:700;text-align:center}
</style></head><body><div class="b">
<div class="tag">PROTOCOLO DIA CHEIO · 7 DIAS</div>
<h1>Mesa vazia não paga boleto.</h1>
<p class="sub">Venda o <b>pior dia</b> do seu restaurante <b>antes</b> do cliente chegar.</p>
<div class="bot"><div class="cover"><img src="capa-ebook.png"></div>
<div class="r"><div class="price"><small>POR APENAS</small><strong>R$ 19,90</strong></div>
<div class="chip">Ebook + 3 planilhas</div><div class="chip">⚡ Acesso imediato</div></div></div>
</div>
<script>function f(){var s=innerWidth/1080;document.body.style.transform="scale("+s+")";document.querySelector('.b').style.height=(innerHeight/s)+"px"}addEventListener('load',f);f();onresize=f;</script>
</body></html>
